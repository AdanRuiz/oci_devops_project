spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

##Properties of UCP
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource
spring.datasource.oracleucp.sql-for-validate-connection=select * from dual
spring.datasource.oracleucp.connection-pool-name=connectionPoolName1
spring.datasource.oracleucp.initial-pool-size=15
spring.datasource.oracleucp.min-pool-size=10
spring.datasource.oracleucp.max-pool-size=30
spring.datasource.oracleucp.validate-connection-on-borrow=true
spring.datasource.oracleucp.inactive-connection-timeout=300
spring.datasource.oracleucp.connection-properties=oracle.net.tns_admin=${TNS_ADMIN}

##Logging properties for UCP
logging.level.root=trace
logging.file.name=logs.log
logging.level.oracle.ucp=trace
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type=TRACE

gemini.api.key=${GEMINI_API_KEY:}
# Default to a currently available preview model for Interactions API.
gemini.api.model=${GEMINI_MODEL:gemini-3.1-flash-lite-preview}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
bot.parser.dry-run=${BOT_PARSER_DRY_RUN:false}
bot.parser.require-confirmation=${BOT_PARSER_REQUIRE_CONFIRMATION:false}
bot.parser.debug=${BOT_PARSER_DEBUG:false}
bot.parser.allow-heuristic-fallback=${BOT_PARSER_ALLOW_HEURISTIC_FALLBACK:false}
bot.use-http-api=${BOT_USE_HTTP_API:false}
bot.internal.api.base-url=${BOT_INTERNAL_API_BASE_URL:http://localhost:8080}
bot.internal.api.key=${BOT_INTERNAL_API_KEY:}

#spring.security.user.name=psong
#spring.security.user.password=WELcome__12345

# TELEGRAM_BOT_TOKEN is injected at runtime via K8s secret (see todolistapp-springboot.yaml)
# The empty default prevents Spring from hard-failing if the env var is absent
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.name=${TELEGRAM_BOT_NAME:oci_cloud_devops_bot}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

